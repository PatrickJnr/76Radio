name: Release draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to compose from CHANGELOG.md'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Compose release notes
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version $version is not a version number such as 0.1.0."
            }
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag $tag is not a version tag such as v0.1.0."
            }
            $version = $tag.Substring(1)
          }
          $notes = & pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/changelog.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the $version section from CHANGELOG.md."
          }
          $templatePath = Join-Path $PWD '.github/release-notes-template.md'
          if (-not (Test-Path -LiteralPath $templatePath)) {
            throw "Release notes template not found at $templatePath."
          }
          $template = Get-Content -LiteralPath $templatePath -Raw
          if (-not $template.Contains('{{CHANGELOG}}')) {
            throw 'Release notes template is missing the {{CHANGELOG}} placeholder.'
          }
          $body = $template.Replace('{{CHANGELOG}}', ($notes -join "`n").Trim())
          $body | Set-Content -LiteralPath release-notes.md -Encoding utf8
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $body | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host $body
          }
      - name: Create draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "76Radio $version" --notes-file release-notes.md
