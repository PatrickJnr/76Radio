; 76Radio settings. The surface module reads this file once, when the game starts.
; Delete a line, or the whole file, to get that default back.

[Logging]
; 0 stops 76Radio from writing Data\XSCAL\76Radio\76Radio.log at all.
; Accepts 1/0, true/false, on/off or yes/no.
Enabled=1
; Rotate the log once it would grow past this many kilobytes; the previous file is kept as
; 76Radio.log.1, so the pair stays bounded. 0 turns rotation off. Allowed range 16 to 65536.
MaxKb=1024

[Media]
; How long after the game starts the module waits before asking Windows for Spotify,
; in milliseconds. Raise it if a slow start leaves Spotify out of reach.
StartupDelayMs=4000
; How often Windows is asked for the current Spotify reading, in milliseconds.
; Lower is more responsive and does more work; the allowed range is 100 to 60000.
PollIntervalMs=900

[Channel]
; How often the module looks for a command from the Pip-Boy, in milliseconds.
; The allowed range is 20 to 5000.
PollIntervalMs=150

[UI]
; Panel diagnostics. Both are off in the normal radio UI; turn one on to see the
; connection line or the artwork loader line while tuning.
ShowStatus=0
ShowArtStatus=0
; Set to 0 to hide the album artwork and leave the wave strip in its place.
ShowArtwork=1
; Keep the now-playing card on screen instead of showing it as a seven second toast.
; Useful when streaming so viewers always see the current track. 0 is the old behaviour.
KeepNowPlaying=0
