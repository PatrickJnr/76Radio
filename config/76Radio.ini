; 76Radio settings, read once when the game starts. Delete a line, or the whole file,
; to get its default back. Booleans accept 1/0, true/false, on/off or yes/no.

[UI]
; 1 keeps the now-playing card on screen as a mini player instead of a seven second toast.
KeepNowPlaying=0
; Default card size as a percentage, 50 to 200. The in-game editor (CTRL+SHIFT+L) overrides it.
CardScale=100
; Default card opacity as a percentage, 20 to 100. The in-game editor overrides it.
CardOpacity=100
; 1 hides the card while VATS is active.
HideInVats=0
; 0 hides the album artwork and shows the wave strip instead.
ShowArtwork=1
; Panel diagnostics for tuning. Leave both off.
ShowStatus=0
ShowArtStatus=0

[Hotkeys]
; In game shortcuts that work with the Pip-Boy closed. Join keys with +, for example CTRL+SHIFT+P.
; Understood: A to Z, 0 to 9, F1 to F12, NUM0 to NUM9, SPACE, LEFT, UP, RIGHT, DOWN,
; CTRL, SHIFT and ALT. An empty value turns that hotkey off.
PlayPause=CTRL+SHIFT+P
Next=CTRL+SHIFT+N
Previous=CTRL+SHIFT+B
ToggleCard=CTRL+SHIFT+U

[Media]
; How long to wait before asking Windows for Spotify, 0 to 60000 ms. Raise it after a slow start.
StartupDelayMs=4000
; How often Spotify is read, 100 to 60000 ms.
PollIntervalMs=900

[Channel]
; How often commands from the Pip-Boy are read, 20 to 5000 ms.
PollIntervalMs=150

[Logging]
; 0 stops Data\XSCAL\76Radio\76Radio.log being written.
Enabled=1
; Log size before it rotates to 76Radio.log.1, 16 to 65536. 0 turns rotation off.
MaxKb=1024
